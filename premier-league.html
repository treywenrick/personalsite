<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier League | Trey Wenrick</title>
    <meta
      name="description"
      content="Live Premier League standings on Trey Wenrick's website."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="index.html">Trey Wenrick</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="experience.html">Experience</a>
          <a href="projects.html">Projects</a>
          <a href="travel.html">Travel</a>
          <a href="premier-league.html" aria-current="page">Premier League</a>
          <a href="cool-things.html">Cool Things</a>
          <a href="contact.html">Contact</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </header>

      <main class="page-main">
        <section class="section premier-league-section">
          <div class="premier-league-shell reveal">
            <div class="premier-league-card">
              <div class="premier-league-card-header">
                <div>
                  <p class="premier-league-card-kicker">Live Standings</p>
                  <h3>English Premier League</h3>
                </div>
                <p class="premier-league-updated" id="pl-updated">Loading...</p>
              </div>

              <div class="premier-league-table-wrap">
                <table class="premier-league-table">
                  <thead>
                    <tr>
                      <th scope="col">#</th>
                      <th scope="col">Club</th>
                      <th scope="col">P</th>
                      <th scope="col">W</th>
                      <th scope="col">D</th>
                      <th scope="col">L</th>
                      <th scope="col">GD</th>
                      <th scope="col">Pts</th>
                    </tr>
                  </thead>
                  <tbody id="pl-table-body">
                    <tr>
                      <td colspan="8" class="premier-league-loading">Loading live table...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div class="premier-league-source-wrap">
              <p class="premier-league-source-bubble">
                Data source: TheSportsDB English Premier League table feed.
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
