<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel | Trey Wenrick</title>
    <meta
      name="description"
      content="Travel journal and interactive globe by Trey Wenrick."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="index.html">Trey Wenrick</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="experience.html">Experience</a>
          <a href="projects.html">Projects</a>
          <a href="travel.html" aria-current="page">Travel</a>
          <a href="premier-league.html">Premier League</a>
          <a href="cool-things.html">Cool Things</a>
          <a href="contact.html">Contact</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </header>

      <main class="page-main">
        <section class="section travel-section">
          <div class="section-heading reveal">
            <p class="eyebrow">Travel</p>
            <h2>The world through my eyes</h2>
          </div>

          <div class="travel-layout">
            <div class="travel-copy reveal">
              <div class="travel-panel is-empty" id="travel-panel">
                <img class="travel-panel-image" id="travel-panel-image" alt="Travel location preview" hidden />
                <div class="travel-panel-body">
                  <p class="travel-panel-kicker" id="travel-panel-kicker" hidden>Travel Journal</p>
                  <h3 class="travel-panel-title" id="travel-panel-title">
                    A living record of the places that have shaped how I see the world.
                  </h3>
                  <p class="travel-panel-text" id="travel-panel-text">
                    Each destination on this page carries a story, a season of life, or a memory that still stays with me.
                  </p>
                </div>
              </div>
            </div>

            <div class="globe-card reveal">
              <div class="globe-stage">
                <canvas
                  id="travel-globe"
                  class="travel-globe"
                  width="720"
                  height="720"
                  aria-label="Interactive 3D globe"
                ></canvas>
                <div class="globe-label-layer" id="globe-label-layer" aria-hidden="true"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
